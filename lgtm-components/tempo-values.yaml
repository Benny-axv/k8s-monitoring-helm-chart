tempo:
  replication_factor: 1
  # 連結 MinIO S3 儲存
  storage:
    trace:
      backend: s3
      s3:
        endpoint: minio.minio.svc.cluster.local:9000
        bucket: tempo
        access_key: admin
        secret_key: Password123!
        insecure: true
        forcepathstyle: true

ingester:
  nodeSelector:
    kubernetes.io/hostname: "a228"
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

distributor:
  nodeSelector:
    kubernetes.io/hostname: "a228"
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
