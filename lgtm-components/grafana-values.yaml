adminPassword: "AdminPassword123!"

service:
  type: NodePort

# 預設自動綁定好內建的數據來源 (Data Sources)
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        url: http://lgtm-components-loki-gateway.lgtm-system.svc.cluster.local
        isDefault: true
      - name: Mimir
        type: prometheus
        url: http://lgtm-components-mimir-nginx.lgtm-system.svc.cluster.local/prometheus
        isDefault: false
      - name: Tempo
        type: tempo
        url: http://lgtm-components-tempo-query-frontend.lgtm-system.svc.cluster.local:3100
        isDefault: false

nodeSelector:
  kubernetes.io/hostname: "a228"
tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
