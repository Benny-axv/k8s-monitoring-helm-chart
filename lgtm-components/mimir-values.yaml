# 連結 MinIO S3 儲存
mimir:
  structuredConfig:
    common:
      storage:
        backend: s3
        s3:
          endpoint: minio.minio.svc.cluster.local:9000
          bucket_name: mimir
          access_key_id: admin
          secret_access_key: Password123!
          insecure: true
          s3_force_path_style: true

alertmanager:
  enabled: false

# 鎖定在 Master Node a228
ingester:
  zoneAwareReplication:
    enabled: false
  nodeSelector:
    kubernetes.io/hostname: "a228"
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

store_gateway:
  zoneAwareReplication:
    enabled: false
  nodeSelector:
    kubernetes.io/hostname: "a228"
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

compactor:
  nodeSelector:
    kubernetes.io/hostname: "a228"
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
