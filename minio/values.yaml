# ----------------------------------------------------
# 1. 啟用分散式模式，並將 Replicas 設為 4 (MinIO 分散式的最小高可用門檻)
# ----------------------------------------------------
mode: distributed
replicas: 4               # MinIO Erasure Coding 最小高可用所需數量為 4
drivesPerNode: 1          # 每台 Pod 掛載 1 個 PersistentVolume

rootUser: "admin"
rootPassword: "Password123!"

# ----------------------------------------------------
# 2. 降低記憶體，讓 4 個 Pod 能輕鬆分散在 3 台 Node 上
# ----------------------------------------------------
resources:
  requests:
    memory: 256Mi          # 4 * 256Mi = 僅消耗全叢集 1GB RAM！
    cpu: 100m
  limits:
    memory: 1Gi

# ----------------------------------------------------
# 3. 持久化儲存與自動建桶
# ----------------------------------------------------
persistence:
  enabled: true
  storageClass: local-path
  size: 10Gi

defaultBuckets: "mimir,loki,tempo"
buckets:
  - name: mimir
  - name: loki
  - name: tempo

# ----------------------------------------------------
# 4. 允許排程在全部 3 台節點上 (移除 nodeSelector constraint)
# ----------------------------------------------------
tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

# 打散 Pod 到 3 台 Worker 節點上 ( Pod Anti-Affinity )
topologySpreadConstraints:
  - maxSkew: 2
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app: minio
