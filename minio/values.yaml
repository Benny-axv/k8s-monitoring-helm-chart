# ----------------------------------------------------
# 1. 關鍵設定：強制指定為單機/單節點模式 (Standalone)
# ----------------------------------------------------
mode: standalone
replicas: 1

rootUser: "admin"
rootPassword: "Password123!"

# ----------------------------------------------------
# 2. 降低昂貴的預設資源請求 (給予合理的 RAM/CPU)
# ----------------------------------------------------
resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 2Gi

# ----------------------------------------------------
# 3. 持久化磁碟設定
# ----------------------------------------------------
persistence:
  enabled: true
  storageClass: local-path
  size: 20Gi

# ----------------------------------------------------
# 4. 自動建立三個監控服務所需的 S3 Buckets
# ----------------------------------------------------
defaultBuckets: "mimir,loki,tempo"
buckets:
  - name: mimir
  - name: loki
  - name: tempo

# ----------------------------------------------------
# 5. 節點排程鎖定 ( Master Node a228)
# ----------------------------------------------------
nodeSelector:
  kubernetes.io/hostname: "a228"
tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
