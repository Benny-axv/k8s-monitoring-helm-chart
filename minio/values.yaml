rootUser: "admin"
rootPassword: "Password123!"

persistence:
  enabled: true
  storageClass: local-path
  size: 20Gi

# 自動建立三個服務所需的 S3 Buckets
defaultBuckets: "mimir,loki,tempo"
buckets:
  - name: mimir
  - name: loki
  - name: tempo

nodeSelector:
  kubernetes.io/hostname: "a228"
tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
