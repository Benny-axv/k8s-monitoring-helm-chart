# ----------------------------------------------------
# 1. 開啟四神獸：Loki, Grafana, Tempo, Mimir
# ----------------------------------------------------
grafana:
  enabled: true
  adminPassword: "AdminPassword123!"
  service:
    type: NodePort

loki:
  enabled: true
  structuredConfig:
    common:
      path_prefix: /var/loki
      storage:
        type: filesystem # 測試環境免雲端 S3/GCS 物件儲存

tempo:
  enabled: true          # 這下真的有 Tempo 了！

mimir:
  enabled: true          # 代替舊版單機 Prometheus 的現代指標資料庫

# ----------------------------------------------------
# 2. 停用與 k8s-monitoring (Alloy) 重複的採集 Exporters
# ----------------------------------------------------
prometheus-node-exporter:
  enabled: false

kube-state-metrics:
  enabled: false

promtail:
  enabled: false
