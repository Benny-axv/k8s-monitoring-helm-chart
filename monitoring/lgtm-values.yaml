# ----------------------------------------------------
# 1. Grafana (UI 與展示介面)
# ----------------------------------------------------
grafana:
  enabled: true
  adminPassword: "AdminPassword123!"
  service:
    type: NodePort

# ----------------------------------------------------
# 2. MinIO (物件儲存後端)
# ----------------------------------------------------
minio:
  enabled: true
  persistence:
    enabled: true
    storageClass: local-path
    size: 20Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
  # 💡 同時寫入多種語法格式，確保相容不同版本的 MinIO Helm Subchart
  defaultBuckets: "mimir,loki,tempo"
  buckets:
    - name: mimir
    - name: loki
    - name: tempo

# ----------------------------------------------------
# 3. Tempo (Traces - 鏈路追蹤)
# ----------------------------------------------------
tempo:
  enabled: true
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
  ingester:
    persistence:
      enabled: true
      storageClass: local-path
      size: 10Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m

# ----------------------------------------------------
# 4. Loki (Logs - 日誌服務)
# ----------------------------------------------------
loki:
  enabled: true
  ingester:
    persistence:
      enabled: true
      storageClass: local-path
      size: 10Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
  structuredConfig:
    common:
      path_prefix: /var/loki
      storage:
        type: filesystem       # 指定使用本地檔案系統

# ----------------------------------------------------
# 5. Mimir (Metrics - 指標資料庫)
# ----------------------------------------------------
mimir:
  enabled: true
  
  # 全域儲存後端設定
  structuredConfig:
    blocks_storage:
      backend: s3

  nginx:
    enabled: true

  # 停用用不到的 Alertmanager（大幅節省記憶體）
  alertmanager:
    enabled: false

  # --------------------------------------------------
  # 給予關鍵 Mimir 組件足夠的記憶體與 Readiness 探針寬限期
  # --------------------------------------------------
  querier:
    resources:
      requests:
        memory: 512Mi
        cpu: 100m
      limits:
        memory: 1Gi
    readinessProbe:
      initialDelaySeconds: 60
      timeoutSeconds: 5

  query_frontend:
    resources:
      requests:
        memory: 256Mi
        cpu: 100m

  distributor:
    resources:
      requests:
        memory: 256Mi
        cpu: 100m

  # 微服務組件 PV/PVC 與記憶體設定
  ingester:
    persistentVolume:
      enabled: true
      storageClass: local-path
      size: 10Gi
    resources:
      requests:
        memory: 512Mi
        cpu: 100m

  store_gateway:
    persistentVolume:
      enabled: true
      storageClass: local-path
      size: 10Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m

  compactor:
    persistentVolume:
      enabled: true
      storageClass: local-path
      size: 10Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
