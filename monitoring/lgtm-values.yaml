# ----------------------------------------------------
# 禁用與 k8s-monitoring 重複的採集組件
# ----------------------------------------------------
promtail:
  enabled: false # 由 Alloy 代替 Log 採集

prometheus-node-exporter:
  enabled: false # 由 k8s-monitoring 的 node-exporter 代替

kube-state-metrics:
  enabled: false # 由 k8s-monitoring 的 kube-state-metrics 代替

# ----------------------------------------------------
# 保留原本的儲存與 UI 組件
# ----------------------------------------------------
grafana:
  enabled: true
  adminPassword: "AdminPassword123!"
  service:
    type: NodePort

prometheus:
  enabled: true
  alertmanager:
    enabled: false # 如果 Alertmanager 一直 Pending (缺 PVC 或資源)，不需要可以先停用
  server:
    retention: 7d

loki:
  enabled: true
  persistence:
    enabled: false

tempo:
  enabled: true
