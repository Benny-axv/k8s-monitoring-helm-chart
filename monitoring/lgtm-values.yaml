# ----------------------------------------------------
# 1. UI 與展示介面
# ----------------------------------------------------
grafana:
  enabled: true
  adminPassword: "AdminPassword123!"
  service:
    type: NodePort

# ----------------------------------------------------
# 2. Tempo (Traces) - 啟用 local-path 動態持久化
# ----------------------------------------------------
tempo:
  enabled: true
  ingester:
    persistence:
      enabled: true
      storageClass: local-path  # 自動由 local-path 生成 PV 存放 Traces WAL
      size: 10Gi

# ----------------------------------------------------
# 3. Loki (Logs) - 啟用 local-path 動態持久化
# ----------------------------------------------------
loki:
  enabled: true
  ingester:
    persistence:
      enabled: true
      storageClass: local-path  # 自動由 local-path 生成 PV 存放 Log
      size: 10Gi
  structuredConfig:
    common:
      path_prefix: /var/loki
      storage:
        type: filesystem       # 使用本地檔案系統

# ----------------------------------------------------
# 4. MinIO (物件儲存) - 啟用 local-path 動態持久化
# ----------------------------------------------------
minio:
  enabled: true
  persistence:
    enabled: true
    storageClass: local-path    # 自動由 local-path 生成 PV
    size: 20Gi

# ----------------------------------------------------
# 5. Mimir (Metrics) - 啟用 local-path 動態持久化
# ----------------------------------------------------
mimir:
  enabled: true
  
  ingester:
    persistentVolume:
      enabled: true
      storageClass: local-path  # 自動由 local-path 生成 PV 存放 Metrics
      size: 10Gi
  store_gateway:
    persistentVolume:
      enabled: true
      storageClass: local-path
      size: 10Gi
  compactor:
    persistentVolume:
      enabled: true
      storageClass: local-path
      size: 10Gi
  alertmanager:
    persistentVolume:
      enabled: false            # 測試環境用量極低，維持關閉即可

# ----------------------------------------------------
# 6. 停用與 k8s-monitoring (Alloy) 重複的採集 Exporters
# ----------------------------------------------------
prometheus-node-exporter:
  enabled: false

kube-state-metrics:
  enabled: false

promtail:
  enabled: false
