# ----------------------------------------------------
# 1. 最外層的關閉項目
# ----------------------------------------------------
promtail:
  enabled: false

# ----------------------------------------------------
# 2. 保留儲存與 UI，並關閉 PVC 避免 Pending
# ----------------------------------------------------
grafana:
  enabled: true
  adminPassword: "AdminPassword123!"
  service:
    type: NodePort

loki:
  enabled: true
  persistence:
    enabled: false

tempo:
  enabled: true

# ----------------------------------------------------
# 3. prometheus 子 Chart 區塊（縮排是關鍵！）
# ----------------------------------------------------
prometheus:
  enabled: true

  # 關閉 prometheus 內建的 node-exporter (必須放在 prometheus 裡面)
  nodeExporter:
    enabled: false
  prometheus-node-exporter:
    enabled: false

  # 關閉 prometheus 內建的 kube-state-metrics
  kubeStateMetrics:
    enabled: false
  kube-state-metrics:
    enabled: false

  alertmanager:
    enabled: false       # 不需要 Alertmanager 就直接關掉
  pushgateway:
    enabled: false       # 不需要也可以關掉，省資源
  server:
    retention: 7d
    persistentVolume:    # 關閉 PV 請求，解決 PVC unbound 問題
      enabled: false
