# ----------------------------------------------------
# 1. 徹底關閉與 k8s-monitoring 重複的採集組件
# ----------------------------------------------------
promtail:
  enabled: false

# 關閉 node-exporter
prometheus-node-exporter:
  enabled: false
nodeExporter:            # 某些子 Chart 版本的名稱是這個，兩個都寫 false 確保關乾淨
  enabled: false

# 關閉 kube-state-metrics
kube-state-metrics:
  enabled: false
kubeStateMetrics:        # 備用 key 名稱
  enabled: false

# ----------------------------------------------------
# 2. 保留儲存與 UI，並關閉 PVC 避免 Pending
# ----------------------------------------------------
grafana:
  enabled: true
  adminPassword: "AdminPassword123!"
  service:
    type: NodePort

prometheus:
  enabled: true
  alertmanager:
    enabled: false        # 不需要 Alertmanager 就直接關掉
  pushgateway:
    enabled: false        # 不需要也可以關掉，省資源
  server:
    retention: 7d
    persistentVolume:     # 關鍵！關閉 PV 請求，解決 PVC unbound 問題
      enabled: false

loki:
  enabled: true
  persistence:
    enabled: false

tempo:
  enabled: true
