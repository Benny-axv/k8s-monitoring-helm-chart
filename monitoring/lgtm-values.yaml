# ----------------------------------------------------
# 1. Grafana (UI 與展示介面)
# ----------------------------------------------------
grafana:
  enabled: true
  adminPassword: "AdminPassword123!"
  service:
    type: NodePort

# ----------------------------------------------------
# 2. MinIO (物件儲存後端)
# ----------------------------------------------------
minio:
  enabled: true
  persistence:
    enabled: true
    storageClass: local-path    # 使用 local-path 動態配發 PV
    size: 20Gi

# ----------------------------------------------------
# 3. Tempo (Traces - 鏈路追蹤)
# ----------------------------------------------------
tempo:
  enabled: true
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
  ingester:
    persistence:
      enabled: true
      storageClass: local-path
      size: 10Gi

# ----------------------------------------------------
# 4. Loki (Logs - 日誌服務)
# ----------------------------------------------------
loki:
  enabled: true
  ingester:
    persistence:
      enabled: true
      storageClass: local-path
      size: 10Gi
  structuredConfig:
    common:
      path_prefix: /var/loki
      storage:
        type: filesystem       # 指定使用本地檔案系統

# ----------------------------------------------------
# 5. Mimir (Metrics - 指標資料庫)
# ----------------------------------------------------
mimir:
  enabled: true
  
  # 全域儲存後端設定
  structuredConfig:
    blocks_storage:
      backend: s3

  # 開啟多租戶與 Gateway
  nginx:
    enabled: true

  # 各個微服務元件之動態 PV/PVC 設定
  ingester:
    persistentVolume:
      enabled: true
      storageClass: local-path
      size: 10Gi
  store_gateway:
    persistentVolume:
      enabled: true
      storageClass: local-path
      size: 10Gi
  compactor:
    persistentVolume:
      enabled: true
      storageClass: local-path
      size: 10Gi
  alertmanager:
    persistentVolume:
      enabled: false            # 測試環境用量低，維持關閉
