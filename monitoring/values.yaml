cluster:
  name: k8s-cluster-a228

# 1. 數據指標收集 (透過 Grafana Alloy)
metrics:
  enabled: true
  alloy:
    metrics:
      enabled: true
  cost:
    enabled: false
  node-exporter:
    enabled: true
  kube-state-metrics:
    enabled: true

opencost:
  enabled: false

# 2. 徹底停用 Logs 與 Events 模組
logs:
  enabled: false
events:
  enabled: false

# 3. 自動收集 K8s Annotations 服務發現 (完全不需 CRD!)
annotations:
  enabled: true

# 4. 部署自建 Prometheus 與 Grafana
prometheus:
  enabled: true

grafana:
  enabled: true
  adminPassword: "AdminPassword123!"
  service:
    type: NodePort

# 5. 【關鍵修復】補齊 Prometheus 與 Loki 的偽裝對接網址
# 這樣不論 Helm Template 怎麼嚴格檢查，都會直接通過 Pass！
externalServices:
  prometheus:
    host: "http://grafana-k8s-monitoring-prometheus.monitoring.svc.cluster.local:9090"
    writeEndpoint: "/api/v1/write"
  loki:
    host: "http://localhost:3100"
    writeEndpoint: "/loki/api/v1/push"
