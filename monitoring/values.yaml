# ----------------------------------------------------
# 全域叢集名稱
# ----------------------------------------------------
cluster:
  name: k8s-cluster-a228

# ----------------------------------------------------
# 1. 傳送目的地 (Destinations - v3.x 重構標準)
# ----------------------------------------------------
destinations:
  # 1a. Mimir Metrics 目的地
  - name: mimir
    type: prometheus
    url: "http://lgtm-stack-mimir-nginx.lgtm-system.svc.cluster.local:80/api/v1/push"

  # 1b. Loki Logs 目的地
  - name: loki
    type: loki
    url: "http://lgtm-stack-loki-gateway.lgtm-system.svc.cluster.local:80/loki/api/v1/push"

  # 1c. Tempo Traces 目的地 (OTLP HTTP/gRPC)
  - name: tempo
    type: otlp
    protocol: http
    url: "http://lgtm-stack-tempo-distributor.lgtm-system.svc.cluster.local:4318"

# ----------------------------------------------------
# 2. 採集功能模組 (Features - v3.x 最新結構)
# ----------------------------------------------------

# 2a. 叢集指標與主機硬體採集 (包含 kube-state-metrics 與 node-exporter)
clusterMetrics:
  enabled: true

# 2b. Pod Console 日誌收集
podLogs:
  enabled: true

# 2c. K8s 系統事件收集 (如 Pod 被 OOMKill/ImagePullBackOff 等事件送往 Loki)
clusterEvents:
  enabled: true

# 2d. eBPF 零代碼自動追蹤 (Grafana Beyla - 自動產生 RED Metrics & Traces)
applicationObservability:
  enabled: true
  receivers:
    otlp:
      grpc:
        enabled: true
      http:
        enabled: true

# 2e. Pod / Service Annotations 自動服務發現
annotationAutodiscovery:
  enabled: true

# ----------------------------------------------------
# 3. 停用不必要的昂貴微服務 (節省資源)
# ----------------------------------------------------
costMetrics:
  enabled: false # 停用 OpenCost
