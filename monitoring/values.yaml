cluster:
  name: k8s-cluster-a228

# 1. 指標數據收集 (透過 Alloy)
metrics:
  enabled: true
  alloy:
    metrics:
      enabled: true
  cost:
    enabled: false
  node-exporter:
    enabled: true
  kube-state-metrics:
    enabled: true

# 2. 開啟 K8s 原生 Annotations 自動服務發現 (不用 CRD!)
annotations:
  enabled: true

# 3. 部署自建 Prometheus 並將 Alloy 資料注入內部 Prometheus
prometheus:
  deploy: true

# 4. 關閉對外部 Grafana Cloud 的遠端寫入驗證 (讓它指向內部 Prometheus)
externalServices:
  prometheus:
    host: "http://grafana-k8s-monitoring-prometheus.monitoring.svc.cluster.local:9090"
    writeEndpoint: "/api/v1/write"

# 5. 部署自建 Grafana (視覺化畫面)
grafana:
  deploy: true
  adminPassword: "AdminPassword123!"
  service:
    type: NodePort
