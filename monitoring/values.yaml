# ----------------------------------------------------
# 全域叢集名稱
# ----------------------------------------------------
cluster:
  name: k8s-cluster-a228

# ----------------------------------------------------
# 1. 傳送目的地 (Destinations - v3.x 重構標準)
# ----------------------------------------------------
destinations:
  # 1a. Mimir Metrics 目的地
  - name: mimir
    type: prometheus
    url: "http://lgtm-stack-mimir-nginx.lgtm-system.svc.cluster.local:80/api/v1/push"

  # 1b. Loki Logs 目的地
  - name: loki
    type: loki
    url: "http://lgtm-stack-loki-gateway.lgtm-system.svc.cluster.local:80/loki/api/v1/push"

  # 1c. Tempo Traces 目的地 (OTLP HTTP/gRPC)
  - name: tempo
    type: otlp
    protocol: http
    url: "http://lgtm-stack-tempo-distributor.lgtm-system.svc.cluster.local:4318"

# ----------------------------------------------------
# 2. 採集功能模組 (Features - v3.x 最新結構)
# ----------------------------------------------------

# 2a. 叢集指標與主機硬體採集
clusterMetrics:
  enabled: true

# 2b. Pod Console 日誌收集
podLogs:
  enabled: true

# 2c. K8s 系統事件收集
clusterEvents:
  enabled: true

# 2d. eBPF 零代碼自動追蹤 (Grafana Beyla)
applicationObservability:
  enabled: true
  receivers:
    otlp:
      grpc:
        enabled: true
      http:
        enabled: true

# 2e. Pod / Service Annotations 自動服務發現
annotationAutodiscovery:
  enabled: true

# ----------------------------------------------------
# 3. 核心收集器組件 (解決 Helm 驗證失敗的關鍵區塊)
# ----------------------------------------------------
alloy-metrics:
  enabled: true  # 👈 修正重點：Annotation Autodiscovery 必須依賴 alloy-metrics！

alloy-singleton:
  enabled: true  # 用於 Cluster Events 等單例收集

alloy-logs:
  enabled: true  # 用於 Pod Logs 收集

# ----------------------------------------------------
# 4. 停用不必要的昂貴微服務 (節省資源)
# ----------------------------------------------------
costMetrics:
  enabled: false
