apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lgtm-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # 來源 A：改用 Grafana 的 lgtm-distributed Chart
    - repoURL: 'https://grafana.github.io/helm-charts'
      chart: lgtm-distributed
      targetRevision: "*"              # 請依你需要指定版號或使用最新版
      helm:
        valueFiles:
          - '$values/monitoring/lgtm-values.yaml'

    # 來源 B：你的 GitHub 儲存庫
    - repoURL: 'https://github.com/Benny-axv/k8s-monitoring-helm-chart.git'
      targetRevision: main
      ref: values

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
